<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Chat Demo</title>

<style>
  /* ===== Colours (CSS variables, light + dark mode) ===== */
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #111827;
    --muted: #5b6475;
    --border: #d8dee8;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --other: #e4e9f1;
    --other-text: #111827;
    --ok: #16a34a;
    --bad: #dc2626;
    --warn-bg: #fff4d6;
    --warn-text: #5c3d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b;
      --surface: #18202b;
      --text: #f1f5f9;
      --muted: #9aa6b8;
      --border: #2b3647;
      --accent: #2f6bf0;
      --other: #263244;
      --other-text: #f1f5f9;
      --warn-bg: #4a3a0a;
      --warn-text: #ffe9a8;
    }
  }

  /* ===== Base ===== */
  * { box-sizing: border-box; }
  html { font-size: 18px; }                       /* readable on a phone */
  @media (min-width: 1200px) { html { font-size: 24px; } }  /* readable from the back of a room */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input { font: inherit; }

  /* ===== Layout: header / (host bar) / (banner) / messages / input ===== */
  .app {
    height: 100vh;               /* fallback */
    height: 100dvh;              /* keeps the layout correct when the phone keyboard opens */
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  @media (min-width: 1200px) { .app { max-width: 1000px; } }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.1rem; }
  .status { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.75rem; }
  .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--muted); }
  .dot.ok  { background: var(--ok); }
  .dot.bad { background: var(--bad); }

  .hostbar {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .hostbar button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 0.5rem;
    padding: 0.45rem 0.8rem;
    cursor: pointer;
  }
  .hostbar button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .banner {
    padding: 0.5rem 1rem;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 0.8rem;
  }
  [hidden] { display: none !important; }

  /* ===== Message list ===== */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; }

  .msg {
    max-width: 80%;
    padding: 0.5rem 0.85rem;
    border-radius: 1rem;
    background: var(--other);
    color: var(--other-text);
    align-self: flex-start;                 /* others: left */
    border-bottom-left-radius: 0.3rem;
  }
  .msg.mine {
    align-self: flex-end;                   /* me: right, accent colour */
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-left-radius: 1rem;
    border-bottom-right-radius: 0.3rem;
  }
  .msg .who  { font-size: 0.7rem; font-weight: 600; opacity: 0.85; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .time { font-size: 0.65rem; opacity: 0.75; text-align: right; }
  .msg.new { animation: fadein 150ms ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg.new { animation: none; } }

  /* ===== Input bar (always at the bottom) ===== */
  .composer {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .composer input {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--bg);
    color: var(--text);
  }
  .composer button {
    border: 0;
    border-radius: 0.6rem;
    padding: 0 1.1rem;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .composer input:disabled, .composer button:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ===== Join card (nickname) and config message ===== */
  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.55);
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.4rem;
    text-align: center;
  }
  .card h2 { margin: 0 0 0.8rem; font-size: 1.2rem; }
  .card input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--bg);
    color: var(--text);
    text-align: center;
  }
  .card button {
    width: 100%;
    border: 0; border-radius: 0.6rem;
    padding: 0.65rem;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  .card .error { color: var(--bad); font-size: 0.75rem; min-height: 1em; margin: 0 0 0.6rem; }
</style>
</head>

<body>

<!-- Shown only if the Firebase config has not been filled in -->
<div id="configMsg" class="overlay" hidden>
  <div class="card">
    <h2>Almost there</h2>
    <p>Add your Firebase config in <code>index.html</code>.</p>
    <p style="font-size:0.75rem;color:var(--muted)">Look for the line <code>// PASTE YOUR CONFIG HERE</code>.</p>
  </div>
</div>

<div class="app" id="app">
  <header>
    <h1>Live Chat Demo</h1>
    <div class="status"><span id="count">0 messages</span><span class="dot" id="dot"></span></div>
  </header>

  <!-- Host controls: only visible with ?host=1 -->
  <div class="hostbar" id="hostbar" hidden>
    <button id="toggleBtn" class="primary">Open chat to audience</button>
    <button id="clearBtn">Clear chat</button>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="messages" id="messages">
    <div class="empty">Connecting...</div>
  </div>

  <div class="composer">
    <input id="input" type="text" maxlength="280" autocomplete="off" placeholder="Type a message..." disabled>
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<!-- Nickname card -->
<div id="join" class="overlay" hidden>
  <div class="card">
    <h2>Pick a nickname</h2>
    <input id="nickInput" type="text" maxlength="20" autocomplete="off" placeholder="Your nickname">
    <p class="error" id="nickError"></p>
    <button id="joinBtn">Join</button>
  </div>
</div>

<script type="module">
  // ============================================================
  // 0. IMPORTS: Firebase SDK straight from Google's CDN (no npm, no build)
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, orderBy, limitToLast, onSnapshot,
    doc, getDoc, setDoc, getDocs, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // ============================================================
  // 1. FIREBASE CONFIG: replace the placeholders with your own values
  // ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAhjKlgDACJGts_waUAQrKyYhOYpjBakVY",
  authDomain: "nosql-chat-demo.firebaseapp.com",
  projectId: "nosql-chat-demo",
  storageBucket: "nosql-chat-demo.firebasestorage.app",
  messagingSenderId: "1025699884566",
  appId: "1:1025699884566:web:11399d1755db08037e8f37"
};

  // Small helper: find an element by its id
  const $ = (id) => document.getElementById(id);

  // If the placeholders are still there, show a friendly message and stop.
  const configIsEmpty = Object.values(firebaseConfig).some((v) => String(v).includes("PASTE_YOUR"));
  if (configIsEmpty) {
    $("configMsg").hidden = false;
    $("app").hidden = true;
  } else {
    main();
  }

  function main() {
    // ==========================================================
    // 2. SETUP: connect to Firestore and find our page elements
    // ==========================================================
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const roomRef = doc(db, "settings", "room");   // the document that says "open: true/false"

    // Host mode = the URL ends with ?host=1
    const isHost = new URLSearchParams(location.search).get("host") === "1";

    const listEl = $("messages");
    const inputEl = $("input");
    const sendBtn = $("sendBtn");
    const countEl = $("count");
    const dotEl = $("dot");
    const bannerEl = $("banner");

    let nickname = "";       // the current user's nickname
    let roomOpen = false;    // is the chat open to the audience?
    let firstRender = true;  // true until the first batch of messages is drawn
    let forceScroll = false; // true right after I send, so I always see my own message
    let seenIds = new Set(); // ids already drawn (so only NEW bubbles get the fade-in)
    let lastSentAt = 0;      // time of my last message (for the rate limit)

    // localStorage can be blocked (private mode), so we wrap it safely
    const NICK_KEY = "nosql-chat-nickname";
    const loadNick = () => { try { return (localStorage.getItem(NICK_KEY) || "").trim(); } catch { return ""; } };
    const saveNick = (n) => { try { localStorage.setItem(NICK_KEY, n); } catch { /* ignore */ } };

    // Small banner for non-technical error messages
    const showBanner = (text) => { bannerEl.textContent = text; bannerEl.hidden = false; dotEl.className = "dot bad"; };
    const hideBanner = () => { bannerEl.hidden = true; };

    // ==========================================================
    // 3. NICKNAME: ask once, remember it in localStorage
    // ==========================================================
    nickname = loadNick();
    if (nickname) {
      updateComposer();
    } else {
      $("join").hidden = false;
      $("nickInput").focus();
    }

    function join() {
      const n = $("nickInput").value.trim();           // trim = remove spaces around
      if (!n) {                                        // empty or only spaces: reject
        $("nickError").textContent = "Please type a nickname.";
        return;
      }
      nickname = n.slice(0, 20);
      saveNick(nickname);
      $("join").hidden = true;
      updateComposer();
    }
    $("joinBtn").addEventListener("click", join);
    $("nickInput").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

    // ==========================================================
    // 4. COMPOSER: who is allowed to type right now?
    //    Host: always. Audience: only when the host opened the chat.
    // ==========================================================
    function updateComposer() {
      const canSend = !!nickname && (isHost || roomOpen);
      inputEl.disabled = !canSend;
      sendBtn.disabled = !canSend;
      if (canSend) inputEl.placeholder = "Type a message...";
      else inputEl.placeholder = nickname ? "Waiting for the host to open the chat..." : "Join to chat...";
    }

    // ==========================================================
    // 5. SEND: one message = one small document in "messages"
    // ==========================================================
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !nickname) return;                  // reject empty messages
      if (!isHost && !roomOpen) return;                // chat closed for the audience

      const now = Date.now();
      if (now - lastSentAt < 1000) return;             // rate limit: 1 message per second, silently ignored
      lastSentAt = now;

      inputEl.value = "";                              // clear the box...
      inputEl.focus();                                 // ...and keep the keyboard open
      forceScroll = true;

      try {
        // This is the NoSQL moment: we save a whole document in one go.
        await addDoc(collection(db, "messages"), {
          user: nickname,
          text: text.slice(0, 280),
          createdAt: serverTimestamp()                 // the server writes the time, not the phone
        });
      } catch (err) {
        console.error(err);
        showBanner("Connection problem, retrying...");
      }
    }
    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    // ==========================================================
    // 6. LISTEN TO THE ROOM SETTING (open / closed)
    // ==========================================================
    onSnapshot(roomRef, (snap) => {
      roomOpen = snap.exists() && snap.data().open === true;
      updateComposer();
      $("toggleBtn").textContent = roomOpen ? "Close chat" : "Open chat to audience";
    }, (err) => {
      console.error(err);
      showBanner("Connection problem, retrying...");
    });

    // ==========================================================
    // 7. LISTEN TO MESSAGES: onSnapshot = "call me whenever the data changes"
    //    Every new message arrives here on every screen, without refreshing.
    // ==========================================================
    const messagesQuery = query(
      collection(db, "messages"),
      orderBy("createdAt", "asc"),
      limitToLast(100)                                 // only the last 100 messages
    );

    onSnapshot(messagesQuery, (snapshot) => {
      hideBanner();
      dotEl.className = "dot ok";
      renderMessages(snapshot);
    }, (err) => {
      console.error(err);
      showBanner("Connection problem, retrying...");
    });

    // Draw the list of bubbles
    function renderMessages(snapshot) {
      // Were we already near the bottom? Then we keep following new messages.
      const nearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 120;

      listEl.textContent = "";                         // empty the list (safe, no HTML involved)
      const newSeen = new Set();

      snapshot.forEach((d) => {
        // "estimate": a message still being saved has no server time yet, so we guess it
        const m = d.data({ serverTimestamps: "estimate" });
        const isNew = !firstRender && !seenIds.has(d.id);
        newSeen.add(d.id);
        listEl.appendChild(buildBubble(m, isNew));
      });
      seenIds = newSeen;

      if (snapshot.size === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No messages yet. Say hello!";
        listEl.appendChild(empty);
      }

      countEl.textContent = snapshot.size + (snapshot.size === 1 ? " message" : " messages");

      if (firstRender || nearBottom || forceScroll) listEl.scrollTop = listEl.scrollHeight;
      firstRender = false;
      forceScroll = false;
    }

    // Build ONE bubble. We use textContent (never innerHTML) so that
    // anything typed by a user, even <script>, is shown as plain text.
    function buildBubble(m, isNew) {
      const user = String(m.user ?? "");
      const text = String(m.text ?? "");

      const bubble = document.createElement("div");
      bubble.className = "msg" + (user === nickname ? " mine" : "") + (isNew ? " new" : "");

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = user;

      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;

      const time = document.createElement("div");
      time.className = "time";
      const date = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
      time.textContent = date
        ? date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })   // HH:MM
        : "";

      bubble.append(who, body, time);
      return bubble;
    }

    // ==========================================================
    // 8. HOST CONTROLS (only when the URL has ?host=1)
    // ==========================================================
    if (isHost) {
      $("hostbar").hidden = false;

      // Create settings/room if it does not exist yet (closed by default).
      // We check first, so reloading the host page never re-closes an open chat.
      getDoc(roomRef)
        .then((snap) => { if (!snap.exists()) return setDoc(roomRef, { open: false }, { merge: true }); })
        .catch((err) => { console.error(err); showBanner("Connection problem, retrying..."); });

      // Open / close the chat for the audience
      $("toggleBtn").addEventListener("click", async () => {
        try {
          await setDoc(roomRef, { open: !roomOpen }, { merge: true });
        } catch (err) {
          console.error(err);
          showBanner("Connection problem, retrying...");
        }
      });

      // Delete every message (in batches: Firestore allows 500 operations per batch)
      $("clearBtn").addEventListener("click", async () => {
        if (!confirm("Delete ALL messages for everyone?")) return;
        try {
          const snap = await getDocs(collection(db, "messages"));
          let batch = writeBatch(db);
          let n = 0;
          for (const d of snap.docs) {
            batch.delete(d.ref);
            n++;
            if (n === 450) { await batch.commit(); batch = writeBatch(db); n = 0; }
          }
          if (n > 0) await batch.commit();
        } catch (err) {
          console.error(err);
          showBanner("Could not clear the chat. Please try again.");
        }
      });
    }

    // ==========================================================
    // 9. NETWORK STATUS: show a banner if the phone loses Wi-Fi.
    //    Firestore reconnects on its own; we only tell the user.
    // ==========================================================
    window.addEventListener("offline", () => showBanner("Connection problem, retrying..."));
    window.addEventListener("online", () => { hideBanner(); dotEl.className = "dot ok"; });
  }
</script>
</body>
</html>
